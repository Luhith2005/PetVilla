services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: petvilla_backend
    restart: always
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-v&_yc#*9rp810irlp#z4qiod)5h59mwc2gep3zu*n==gh)v!n^
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
    volumes:
      - ./backend/db.sqlite3:/app/db.sqlite3
      - ./backend/media:/app/media
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: petvilla_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
